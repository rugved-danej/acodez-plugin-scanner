name: Build Android Scanner

on:
  schedule:
    - cron: '0 0 * * *' # Check daily
  workflow_dispatch: # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get latest release tag from Acode-Foundation
        id: get_tag
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/Acode-Foundation/plugin_scanner/releases/latest | jq -r .tag_name)
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Check if release exists in this repo
        id: check_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # We check if the release exists on the current repository
          if gh release view ${{ steps.get_tag.outputs.tag }} --repo ${{ github.repository }} &>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout Acode-Foundation repo
        if: steps.check_release.outputs.exists == 'false'
        uses: actions/checkout@v4
        with:
          repository: Acode-Foundation/plugin_scanner
          ref: ${{ steps.get_tag.outputs.tag }}

      - name: Install cross
        if: steps.check_release.outputs.exists == 'false'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build for aarch64-linux-android (64-bit ARM)
        if: steps.check_release.outputs.exists == 'false'
        run: cross build --target aarch64-linux-android --release

      - name: Build for armv7-linux-androideabi (32-bit ARM)
        if: steps.check_release.outputs.exists == 'false'
        run: cross build --target armv7-linux-androideabi --release

      - name: Prepare binaries
        if: steps.check_release.outputs.exists == 'false'
        run: |
          mv target/aarch64-linux-android/release/plugin_scanner plugin_scanner-${{ steps.get_tag.outputs.tag }}-aarch64-linux-android
          mv target/armv7-linux-androideabi/release/plugin_scanner plugin_scanner-${{ steps.get_tag.outputs.tag }}-armv7-linux-androideabi

      - name: Create Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: ${{ steps.get_tag.outputs.tag }}
          files: |
            plugin_scanner-${{ steps.get_tag.outputs.tag }}-aarch64-linux-android
            plugin_scanner-${{ steps.get_tag.outputs.tag }}-armv7-linux-androideabi
